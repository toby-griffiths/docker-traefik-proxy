providers:
  docker:
    exposedByDefault: false
  file:
    directory: /etc/traefik/dynamic_config
    watch: true

api:
  dashboard: true
  insecure: true

entryPoints:
  http:
    address: ':80'
    http:
      redirections:
        entryPoint:
          to: https
          scheme: https
  https:
    address: ':443'
    http3: {}

log:
  level: DEBUG
  format: json
